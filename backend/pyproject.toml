[project]
name = "lunar-prime-backend"
version = "0.1.0"
description = "Lunar Prime: SPICE-based lunar site sunlight and Earth-visibility comparison API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "numpy>=1.26",
  "spiceypy>=6.0",
  "pydantic>=2.7",
  "anthropic>=2.8.0",
  "qdrant-client>=1.20.0",
  "httpx>=0.28.1",
  "rasterio>=1.4.4,<1.5",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
