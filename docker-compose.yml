# One-command deployment:  docker compose up --build   then open http://localhost:3000
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      # The mission analyst is optional. Leave ANTHROPIC_API_KEY unset for a public demo unless you add
      # authentication and spending limits (see DEPLOY.md); everything else works without it.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LUNAR_PRIME_CHAT_DISABLED: ${LUNAR_PRIME_CHAT_DISABLED:-1}
      LUNAR_PRIME_CORS: ${LUNAR_PRIME_CORS:-http://localhost:3000}
    volumes:
      - lunar-data:/data
    restart: unless-stopped
  web:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
volumes:
  lunar-data:
